<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Presenter View</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root { --bg:#07080d; --panel:#13141d; --line:#262736; --ink:#f3efe9; --ink2:#c4c1cf; --ink3:#8b8999; --accent:#ff7a59; --gold:#fbbf24; }
  * { box-sizing: border-box; margin: 0; }
  body { background: var(--bg); color: var(--ink); font-family: Inter, system-ui, sans-serif; padding: 22px; display: grid; grid-template-rows: auto 1fr auto; gap: 18px; height: 100vh; }
  header { display: flex; justify-content: space-between; align-items: center; font-family: "JetBrains Mono", monospace; }
  .big { font-size: 46px; font-weight: 600; color: var(--gold); font-variant-numeric: tabular-nums; }
  .mod { color: var(--accent); font-size: 15px; letter-spacing: .1em; text-transform: uppercase; }
  main { display: grid; grid-template-columns: 1.3fr 1fr; gap: 18px; min-height: 0; }
  .box { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 20px 22px; overflow: auto; }
  .box h4 { font: 600 13px "JetBrains Mono", monospace; letter-spacing: .12em; color: var(--accent); margin-bottom: 10px; text-transform: uppercase; }
  .ttl { font-size: 28px; font-weight: 600; margin-bottom: 14px; }
  .notes { font-size: 21px; line-height: 1.6; color: var(--ink2); }
  .notes ul { padding-left: 22px; } .notes li, .notes p { margin-bottom: 8px; }
  .next { font-size: 22px; color: var(--ink2); }
  .meta { font: 14px "JetBrains Mono", monospace; color: var(--ink3); margin-top: 6px; }
  .beats { display: flex; gap: 6px; margin-top: 12px; } .beats i { width: 12px; height: 12px; border-radius: 50%; background: #2a2b3a; } .beats i.on { background: var(--accent); }
  footer { display: flex; gap: 12px; }
  button { background: var(--panel); color: var(--ink); border: 1px solid var(--line); border-radius: 10px; padding: 14px 22px; font: 600 16px "JetBrains Mono", monospace; cursor: pointer; }
  button:hover { border-color: var(--accent); color: var(--accent); }
  .plan { font: 14px/1.8 "JetBrains Mono", monospace; color: var(--ink3); } .plan .on { color: var(--accent); }
</style>
</head>
<body>
<header>
  <div><div class="mod" id="mod">Waiting for the deck… (press P in the deck)</div><div id="count" class="meta"></div></div>
  <div style="text-align:right"><div class="big" id="elapsed">00:00:00</div><div class="meta">session time · <span id="now"></span></div></div>
</header>
<main>
  <div class="box"><h4>Now</h4><div class="ttl" id="ttl"></div><div class="notes" id="notes"></div><div class="beats" id="beats"></div></div>
  <div style="display:grid;grid-template-rows:auto 1fr;gap:18px;min-height:0">
    <div class="box"><h4>Up next</h4><div class="next" id="next"></div></div>
    <div class="box"><h4>Time plan</h4><div class="plan" id="plan"></div></div>
  </div>
</main>
<footer>
  <button onclick="send('prev')">◀ prev</button>
  <button onclick="send('next')">next ▶</button>
  <button onclick="t0 = Date.now()">start / reset clock</button>
</footer>
<script>
  const chan = new BroadcastChannel('claude-talk');
  const deckFile = new URLSearchParams(location.search).get('deck') || 'index.html';
  const PLAN = [['00', 'Opening', '0:00–0:15'], ['01', 'Mental model', '0:15–0:30'], ['02', 'Claude apps for research', '0:30–1:10'], ['🔬', 'Claude Science deep dive', 'flex'], ['☕', 'Break', '1:10–1:20'],
    ['03', 'Claude Code', '1:20–2:10'], ['04', 'Chrome & Office', '2:10–2:20'], ['05', 'API & Agent SDK', '2:20–2:40'], ['06', 'Research integrity', '2:40–2:48'], ['07', 'Capstone & Q&A', '2:48–3:00']];
  let scenes = [], t0 = null;
  const $ = id => document.getElementById(id);
  const send = cmd => chan.postMessage({ type: 'cmd', cmd });
  $('plan').innerHTML = PLAN.map(([k, n, t]) => `<div data-m="${k}">${k} ${n} — ${t}</div>`).join('');
  document.addEventListener('keydown', e => {
    if (['ArrowRight', ' ', 'PageDown'].includes(e.key)) { e.preventDefault(); send('next'); }
    if (['ArrowLeft', 'PageUp'].includes(e.key)) { e.preventDefault(); send('prev'); }
  });
  setInterval(() => {
    $('now').textContent = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
    if (!t0) return;
    const s = Math.floor((Date.now() - t0) / 1000);
    $('elapsed').textContent = [s / 3600, (s % 3600) / 60, s % 60].map(v => String(Math.floor(v)).padStart(2, '0')).join(':');
  }, 1000);
  fetch(deckFile).then(r => r.text()).then(html => {
    const doc = new DOMParser().parseFromString(html, 'text/html');
    scenes = [...doc.querySelectorAll('.scene, .slide')].map(s => ({
      title: (s.dataset.title || s.querySelector('h1,h2')?.textContent || 'Scene').trim().replace(/\s+/g, ' '),
      notes: s.querySelector('.notes')?.innerHTML || '<p>—</p>',
      module: s.dataset.module || '',
    }));
    chan.postMessage({ type: 'hello' });
  });
  chan.onmessage = ({ data }) => {
    if (data.type !== 'state' || !scenes.length) return;
    const s = scenes[data.idx], n = scenes[data.idx + 1];
    $('mod').textContent = s.module;
    $('count').textContent = `scene ${data.idx + 1} / ${data.total}`;
    $('ttl').textContent = s.title;
    $('notes').innerHTML = s.notes;
    const steps = data.steps || 0;
    $('beats').innerHTML = steps ? Array.from({ length: steps + 1 }, (_, i) => `<i class="${i <= data.frag ? 'on' : ''}"></i>`).join('') : '';
    $('next').textContent = n ? n.title : 'End of deck';
    document.querySelectorAll('#plan div').forEach(d => d.classList.toggle('on', s.module.startsWith(d.dataset.m)));
  };
</script>
</body>
</html>
